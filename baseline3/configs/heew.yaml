run:
  name: cwgangp_joint
  seed: 42
  device: auto
  output_root: experiments/baseline3

data:
  energy_path: data/energy.csv
  weather_path: data/weather.csv
  weather_feature_set: pv10
  seq_len: 24
  num_workers: 0
  pin_memory: false

model:
  latent_dim: 128
  hidden_dim: 128
  num_blocks: 3

training:
  epochs: 300
  batch_size: 32
  lr_g: 0.0001
  lr_d: 0.0001
  betas: [0.0, 0.9]
  critic_steps: 5
  gp_lambda: 10.0
  gradient_clip: 0.0
  val_every: 5
  early_stopping_patience: 12

evaluation:
  batch_size: 64
  val_scenarios: 20
  test_scenarios: 100
